<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحترف | إدارة المشاريع</title><style>body{font-family:system-ui;background:#0d1524;color:#f3f6fb;margin:0;padding:18px;max-width:760px;margin:auto}h1{color:#55d6c2}section{background:#19263a;padding:16px;border-radius:16px;margin:14px 0}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border:1px solid #42516b;border-radius:9px;font:inherit}button{background:#21b69f;color:#071b20;font-weight:bold;border:0}label{display:block;margin-top:8px}.muted{color:#afbdcc}.item{border-top:1px solid #43516a;padding:12px 0}.danger{background:#e8a1a1}small{color:#aebccc}</style><h1>المحترف لأنظمة المراقبة</h1><p class="muted">إدارة المشاريع والكادر والمصاريف — نسخة شخصية</p><section><h2>مشروع جديد</h2><form id="project"><input name="name" placeholder="اسم المشروع" required><input name="client" placeholder="اسم الزبون"><input name="phone" placeholder="رقم الزبون"><input name="revenue" type="number" min="0" placeholder="المبلغ المتفق عليه (دينار)" required><button>إضافة المشروع</button></form></section><section><h2>تفاصيل المشروع</h2><select id="choose"></select><form id="expense"><input name="title" placeholder="اسم المصروف أو العامل" required><select name="type"><option value="wage">أجور الكادر</option><option value="material">مواد ومصاريف</option></select><input name="amount" type="number" min="0" placeholder="المبلغ بالدينار" required><button>إضافة تكلفة للمشروع</button></form><div id="details"></div></section><section><h2>النسخ الاحتياطي</h2><button id="export" type="button">تصدير البيانات JSON</button><label>استعادة نسخة احتياطية<input id="import" type="file" accept="application/json,.json"></label><small>البيانات محفوظة في هذا المتصفح فقط. لا تستخدم التصفح الخاص ولا تمسح بيانات سفاري قبل تصدير نسخة احتياطية.</small></section><script>const key='mohtarif_v1';let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch{}const $=s=>document.querySelector(s),save=()=>{localStorage.setItem(key,JSON.stringify(data));render()},money=n=>Number(n||0).toLocaleString('en-US')+' د.ع',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let chosen=$('#choose').value;$('#choose').innerHTML=data.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');if(data.some(p=>p.id===chosen))$('#choose').value=chosen;let p=data.find(p=>p.id===$('#choose').value);$('#expense').style.display=p?'block':'none';if(!p){$('#details').innerHTML='<p>أضف مشروعاً للبدء.</p>';return}let wage=p.costs.filter(c=>c.type==='wage').reduce((s,c)=>s+c.amount,0),mat=p.costs.filter(c=>c.type!=='wage').reduce((s,c)=>s+c.amount,0);$('#details').innerHTML=`<h3>${esc(p.name)}</h3><p>الزبون: ${esc(p.client)} | ${esc(p.phone)}</p><p>قيمة المشروع: ${money(p.revenue)}<br>أجور الكادر: ${money(wage)}<br>المصاريف: ${money(mat)}<br><strong>الربح المتوقع: ${money(p.revenue-wage-mat)}</strong></p><h3>التكاليف</h3>${p.costs.map(c=>`<div class="item">${esc(c.title)} — ${money(c.amount)} (${c.type==='wage'?'أجور':'مصاريف'}) <button class="danger" data-remove="${c.id}">حذف</button></div>`).join('')}<button class="danger" id="deleteProject">حذف المشروع</button>`;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('حذف التكلفة؟')){p.costs=p.costs.filter(c=>c.id!==b.dataset.remove);save()}});$('#deleteProject').onclick=()=>{if(confirm('حذف المشروع وكل تكاليفه؟')){data=data.filter(x=>x.id!==p.id);save()}}}$('#project').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p={id:crypto.randomUUID(),name:f.get('name'),client:f.get('client'),phone:f.get('phone'),revenue:Number(f.get('revenue')),costs:[]};data.push(p);save();$('#choose').value=p.id;render();e.target.reset()};$('#expense').onsubmit=e=>{e.preventDefault();let p=data.find(x=>x.id===$('#choose').value);if(!p)return;let f=new FormData(e.target);p.costs.push({id:crypto.randomUUID(),title:f.get('title'),type:f.get('type'),amount:Number(f.get('amount'))});save();e.target.reset()};$('#choose').onchange=render;$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='almohtarif-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let incoming=JSON.parse(await file.text());if(!Array.isArray(incoming)||!incoming.every(p=>p.id&&typeof p.name==='string'&&Array.isArray(p.costs)))throw Error();if(confirm('استبدال البيانات الحالية بالنسخة الاحتياطية؟')){data=incoming;save()}}catch{alert('ملف النسخة الاحتياطية غير صالح')}};render();</script></html>
